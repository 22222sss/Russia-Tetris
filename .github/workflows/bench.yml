name: bench

on:
  # 推送到 bench-run 分支即触发默认参数（10 万连接 / 5000 并发 / 保持 30 秒）
  # 没有 token 时也能用它跑一次完整压测
  push:
    branches: [bench-run]
  workflow_dispatch:
    inputs:
      target:
        description: '目标连接数'
        required: true
        default: '10000'
      concurrency:
        description: '并发度'
        required: true
        default: '2000'
      hold:
        description: '保持连接秒数'
        required: true
        default: '30'
      read_check:
        description: '读取欢迎数据 1/0'
        required: true
        default: '1'

permissions:
  contents: read

jobs:
  bench:
    name: ubuntu-latest / bench
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libevent-dev libspdlog-dev libfmt-dev

      - name: Benchmark
        run: |
          bash tests/bench.sh "${{ inputs.target }}" "${{ inputs.concurrency }}" "${{ inputs.hold }}" "${{ inputs.read_check }}"

      - name: Publish key metrics as annotations
        if: always()
        run: |
          d=$(ls -1d bench-results/*/ 2>/dev/null | tail -1)
          if [ -z "$d" ]; then
            echo "::warning::bench-results 目录不存在"
            exit 0
          fi
          if [ -f "${d}env.txt" ]; then
            ul=$(grep -m1 "ulimit" "${d}env.txt" || true)
            if [ -n "$ul" ]; then echo "::notice::env: $ul"; fi
          fi
          if [ -f "${d}summary.md" ] && grep -q "成功建立" "${d}summary.md"; then
            for k in "成功建立" "失败" "总耗时" "建立速率" "服务端内存" "服务端 CPU"; do
              line=$(grep -m1 -- "| $k" "${d}summary.md" || true)
              if [ -n "$line" ]; then echo "::notice::$line"; fi
            done
          else
            echo "::notice::未生成结果，附 result.txt 尾部"
            tail -8 "${d}result.txt" 2>/dev/null | while IFS= read -r line; do echo "::notice::$line"; done
          fi
          exit 0

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results/
          if-no-files-found: warn
