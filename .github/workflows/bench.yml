name: bench

on:
  # 推送到 bench-run 分支即触发默认参数（20 万连接 / 1 万并发 / 4 个客户端进程 / 保持 30 秒）
  # 没有 token 时也能用它跑一次完整压测
  push:
    branches: [bench-run]
  workflow_dispatch:
    inputs:
      target:
        description: '目标连接数'
        required: true
        default: '10000'
      concurrency:
        description: '并发度'
        required: true
        default: '2000'
      hold:
        description: '保持连接秒数'
        required: true
        default: '30'
      read_check:
        description: '读取欢迎数据 1/0'
        required: true
        default: '1'
      clients:
        description: '压测客户端进程数（分片数）'
        required: true
        default: '1'
      workers:
        description: '服务端 worker 数，逗号分隔可做扩展性对比（如 1,2,4）'
        required: true
        default: '1'

permissions:
  contents: read

jobs:
  bench:
    name: ubuntu-latest / bench
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libevent-dev libspdlog-dev libfmt-dev libssl-dev

      - name: Benchmark
        run: |
          TARGET="${{ inputs.target || '100000' }}"
          CONC="${{ inputs.concurrency || '5000' }}"
          HOLD="${{ inputs.hold || '30' }}"
          READ="${{ inputs.read_check || '1' }}"
          CLIENTS="${{ inputs.clients || '2' }}"
          WORKERS="${{ inputs.workers || '' }}"

          run_one() {
            local w="$1" r="$2"
            echo "::notice::开始压测: workers=$w reuseport=${r:-auto} target=$TARGET clients=$CLIENTS"
            BENCH_WORKERS="$w" BENCH_REUSEPORT="$r" \
              bash tests/bench.sh "$TARGET" "$CONC" "$HOLD" "$READ" "$CLIENTS" \
              || echo "::warning::workers=$w reuseport=${r:-auto} 这一轮返回非 0（结果可能不完整）"
          }

          if [ -z "$WORKERS" ]; then
            # push 触发：连接建立基准已经测过（README「多进程 worker 实测」），
            # 本轮只跑游戏负载对比（见下一个 step，那里才是多核该发力的场景）
            echo "::notice::push 触发：跳过连接建立压测，改跑游戏负载对比"
          else
            for w in ${WORKERS//,/ }; do
              if [ "$w" -gt 1 ]; then run_one "$w" 1; else run_one "$w" ""; fi
            done
          fi

      - name: Build -O0 and -O2 binaries
        working-directory: src
        run: |
          # 同一台 runner 上编出两份二进制，随后交错跑 A/B/A/B。
          # 不同 runner 之间的 CPU 波动可达 ±40%，跨 run 比 -O0/-O2 会被噪声淹没。
          set -e
          OPT_DIR="$GITHUB_WORKSPACE/bench-results/opt"
          mkdir -p "$OPT_DIR"
          for opt in O0 O2; do
            make clean > /dev/null
            if ! make -j"$(nproc)" OPT=-$opt > "$OPT_DIR/build-$opt.log" 2>&1; then
              echo "::error::-O$opt 构建失败: $(tail -25 "$OPT_DIR/build-$opt.log" | tr '\n' '|' | cut -c1-1500)"
              exit 1
            fi
            cp tetris_game "$OPT_DIR/tetris_game_$opt"
            echo "已构建 -$opt: $(stat -c%s "$OPT_DIR/tetris_game_$opt") bytes"
          done
          echo "::notice::A/B 二进制就绪：-O0 $(stat -c%s "$OPT_DIR/tetris_game_O0") bytes / -O2 $(stat -c%s "$OPT_DIR/tetris_game_O2") bytes"

      - name: Gameplay A/B -O0 vs -O2 (same runner, interleaved)
        working-directory: src
        run: |
          # 交错跑两轮 A/B：任何随时间漂移的 runner 状态（缓存/降频/邻居负载）
          # 对两个级别的影响都各占一半，比"先跑完 O0 再跑 O2"可靠。
          # 键位参数与 Gameplay scaling test 完全一致，方便与历史数据对照。
          OPT_DIR="$GITHUB_WORKSPACE/bench-results/opt"
          for round in 1 2; do
            for opt in O0 O2; do
              echo "---- 第 $round 轮 / -$opt ----"
              BENCH_BIN="$OPT_DIR/tetris_game_$opt" \
              BENCH_LABEL="workers=1 opt=$opt round=$round" \
                bash ../tests/play_bench.sh 200 20 0.02 "1" 10009
            done
          done

      - name: Gameplay scaling test
        run: |
          # 每个连接真实登录、开局、持续按键（左/右，不按下键以免提前 GAME OVER）。
          # 每次按键服务端都要 strcmp + 整屏重绘，这才是能吃满 CPU 的负载。
          #
          # 参数标定：上一轮 200 玩家 × 0.1s（≈1900 按键/秒）只占 16%~26% 单核，
          # 说明还没到服务端瓶颈（客户端先到上限）。按线性外推，约 1 万按键/秒
          # 才能把单核打满，所以这里用 200 玩家 × 0.02s。
          bash tests/play_bench.sh 200 20 0.02 "1 2 4" 10009

      - name: Publish key metrics as annotations
        if: always()
        run: |
          # 注意：每个 step 的 notice/error/warning 各最多 10 条，
          # 所以每轮压测只发"一条"汇总，而不是一条一个指标。
          dirs=$(ls -1d bench-results/*/ 2>/dev/null | grep -v '/opt/' | tail -3)
          if [ -z "$dirs" ]; then
            echo "::notice::没有连接压测结果目录（push 触发时正常：游戏负载数据在 play_bench 的 notice 里）"
            exit 0
          fi
          for d in $dirs; do
            w=$(grep -m1 '^workers' "${d}env.txt" 2>/dev/null | tr -d ' ' | cut -d: -f2)
            w=${w:-?}
            rp=$(grep -m1 '^reuseport' "${d}env.txt" 2>/dev/null | tr -d ' ' | cut -d: -f2)
            rp=${rp:-auto}
            if [ -f "${d}summary.md" ] && grep -q "成功建立" "${d}summary.md"; then
              summary=""
              for k in "成功建立" "失败" "失败原因" "收到欢迎数据" "总耗时" "建立速率" "服务端内存" "服务端 fd" "服务端 CPU"; do
                line=$(grep -m1 -- "| $k" "${d}summary.md" || true)
                if [ -n "$line" ]; then
                  summary="${summary}$(echo "$line" | sed 's/^| *//; s/ *|$//') ; "
                fi
              done
              envline=$(grep -hE '^(somaxconn|syn_backlog|port_range|tw_reuse)' "${d}env.txt" 2>/dev/null | tr '\n' ' ' || true)
              echo "::notice::[workers=$w reuseport=$rp] $summary | $envline"
            else
              echo "::notice::[workers=$w] 未生成 summary.md，附 result.txt 尾部: $(tail -6 "${d}result.txt" 2>/dev/null | tr '\n' '|' | cut -c1-900)"
            fi
          done
          exit 0

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results/
          if-no-files-found: warn
