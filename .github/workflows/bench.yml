name: bench

on:
  # 推送到 bench-run 分支即触发默认参数（20 万连接 / 1 万并发 / 4 个客户端进程 / 保持 30 秒）
  # 没有 token 时也能用它跑一次完整压测
  push:
    branches: [bench-run]
  workflow_dispatch:
    inputs:
      target:
        description: '目标连接数'
        required: true
        default: '10000'
      concurrency:
        description: '并发度'
        required: true
        default: '2000'
      hold:
        description: '保持连接秒数'
        required: true
        default: '30'
      read_check:
        description: '读取欢迎数据 1/0'
        required: true
        default: '1'
      clients:
        description: '压测客户端进程数（分片数）'
        required: true
        default: '1'
      workers:
        description: '服务端 worker 数，逗号分隔可做扩展性对比（如 1,2,4）'
        required: true
        default: '1'

permissions:
  contents: read

jobs:
  bench:
    name: ubuntu-latest / bench
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libevent-dev libspdlog-dev libfmt-dev

      - name: Benchmark
        run: |
          TARGET="${{ inputs.target || '100000' }}"
          CONC="${{ inputs.concurrency || '5000' }}"
          HOLD="${{ inputs.hold || '30' }}"
          READ="${{ inputs.read_check || '1' }}"
          CLIENTS="${{ inputs.clients || '2' }}"
          WORKERS="${{ inputs.workers || '1,2,4' }}"
          for w in ${WORKERS//,/ }; do
            echo "::notice::开始压测: workers=$w target=$TARGET concurrency=$CONC clients=$CLIENTS"
            BENCH_WORKERS="$w" bash tests/bench.sh "$TARGET" "$CONC" "$HOLD" "$READ" "$CLIENTS" \
              || echo "::warning::workers=$w 这一轮压测返回非 0（结果可能不完整）"
          done

      - name: Publish key metrics as annotations
        if: always()
        run: |
          # 注意：每个 step 的 notice/error/warning 各最多 10 条，
          # 所以每轮压测只发"一条"汇总，而不是一条一个指标。
          dirs=$(ls -1d bench-results/*/ 2>/dev/null | tail -3)
          if [ -z "$dirs" ]; then
            echo "::warning::bench-results 目录不存在"
            exit 0
          fi
          for d in $dirs; do
            w=$(grep -m1 '^workers' "${d}env.txt" 2>/dev/null | tr -d ' ' | cut -d: -f2)
            w=${w:-?}
            if [ -f "${d}summary.md" ] && grep -q "成功建立" "${d}summary.md"; then
              summary=""
              for k in "成功建立" "失败" "总耗时" "建立速率" "服务端内存" "服务端 fd" "服务端 CPU"; do
                line=$(grep -m1 -- "| $k" "${d}summary.md" || true)
                if [ -n "$line" ]; then
                  summary="${summary}$(echo "$line" | sed 's/^| *//; s/ *|$//') ; "
                fi
              done
              echo "::notice::[workers=$w] $summary"
            else
              echo "::notice::[workers=$w] 未生成 summary.md，附 result.txt 尾部: $(tail -6 "${d}result.txt" 2>/dev/null | tr '\n' '|' | cut -c1-900)"
            fi
          done
          exit 0

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results/
          if-no-files-found: warn
