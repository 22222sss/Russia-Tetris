name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ubuntu-latest / g++
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libevent / spdlog / fmt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libevent-dev libspdlog-dev libfmt-dev

      - name: Build
        working-directory: src
        run: |
          make -j"$(nproc)"
          file tetris_game

      - name: Smoke test (200 connections)
        working-directory: src
        run: |
          set +e
          ./tetris_game > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid

          for i in $(seq 1 120); do
            if (exec 3<>/dev/tcp/127.0.0.1/9999) 2>/dev/null; then
              break
            fi
            sleep 1
          done

          python3 ../tests/load_test.py 200 200 1 0 \
            --pid "$(cat /tmp/server.pid)" \
            --json /tmp/smoke.json \
            --min-success 0.95
          RC=$?

          kill "$(cat /tmp/server.pid)" 2>/dev/null
          wait "$(cat /tmp/server.pid)" 2>/dev/null
          cat /tmp/smoke.json 2>/dev/null
          if [ "$RC" -ne 0 ]; then
            echo "---- server.log (tail) ----"
            tail -40 /tmp/server.log
          fi
          exit "$RC"

      - name: Memory sanity check (sizeof User)
        working-directory: src
        run: |
          cat > sizeof_user.cpp <<'EOF'
          #include "TetrisGame/User.h"
          #include <cstdio>
          int main() {
              const double n = 100000.0;
              std::printf("sizeof(User) = %zu bytes; 100k users ~= %.1f MB\n",
                          sizeof(User), sizeof(User) * n / 1024.0 / 1024.0);
              return 0;
          }
          EOF
          if ! g++ -std=c++17 -I. -ICommon -IUtility -IEventLoop -ITetrisGame -IUImanage -IConnectionPool \
                sizeof_user.cpp -o sizeof_user -lspdlog -lfmt -pthread 2> sizeof_err.txt; then
            echo "::error::sizeof check failed: $(tr '\n' '|' < sizeof_err.txt | cut -c1-900)"
            exit 1
          fi
          out=$(./sizeof_user)
          echo "$out"
          echo "::notice::$out"
