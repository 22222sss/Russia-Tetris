name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ubuntu-latest / g++
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libevent / spdlog / fmt / OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libevent-dev libspdlog-dev libfmt-dev libssl-dev

      - name: Build
        working-directory: src
        run: |
          make -j"$(nproc)"
          file tetris_game

      - name: Password hash self-test
        working-directory: src
        run: |
          # 单独测 PasswordHash：集成测试只能看"登录通不通"，哈希实现错了
          # （盐没进 PBKDF2、hex 编解码错位）也可能自洽地通过。这里用 Python
          # hashlib 生成的已知向量做交叉验证，失败细节用注解回传。
          if ! g++ -std=c++17 -Wall -Wextra -I. TetrisGame/PasswordHash.cpp \
                ../tests/password_hash_test.cpp -lcrypto -pthread -o /tmp/ph_test \
                2> /tmp/ph_build.txt; then
            echo "::error::密码哈希自检编译失败: $(tr '\n' '|' < /tmp/ph_build.txt | cut -c1-1200)"
            exit 1
          fi

          set +e
          out=$(/tmp/ph_test 2>&1)
          rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::密码哈希自检失败: $(echo "$out" | tr '\n' '|' | cut -c1-1500)"
            exit 1
          fi
          echo "::notice::密码哈希自检通过: $(echo "$out" | tr '\n' '|' | cut -c1-600)"

      - name: Protocol integration test
        working-directory: src
        run: |
          set +e

          # 先做语法检查：语法错误的报错在日志里读不到，只能用注解回传
          if ! python3 -m py_compile ../tests/integration_test.py 2> /tmp/pyc.txt; then
            echo "::error::integration_test.py 语法错误: $(tr '\n' '|' < /tmp/pyc.txt | cut -c1-800)"
            exit 1
          fi

          # 用干净的数据文件起服务端，工作目录与测试脚本保持一致（userdata.csv 在 src/）
          # 打开 debug 日志：出问题时能通过注解回传服务端的连接/收发细节
          rm -f userdata.csv log.txt
          TETRIS_LOG_LEVEL=debug ./tetris_game > /tmp/it_server.log 2>&1 &
          echo $! > /tmp/it_server.pid

          for i in $(seq 1 120); do
            if (exec 3<>/dev/tcp/127.0.0.1/9999) 2>/dev/null; then
              break
            fi
            sleep 1
          done

          python3 ../tests/integration_test.py --host 127.0.0.1 --port 9999
          RC=$?

          kill "$(cat /tmp/it_server.pid)" 2>/dev/null
          wait "$(cat /tmp/it_server.pid)" 2>/dev/null
          sleep 1

          if [ "$RC" -ne 0 ]; then
            # 服务端日志写在 log.txt（不是 stdout）；挑与连接/收发相关的行
            detail=$(grep -aE 'Client\[|连接池|handleClientData|Error|recv|send|用户|密码|迁移' log.txt 2>/dev/null | tail -30 | tr '\n' '|' | cut -c1-1500)
            if [ -z "$detail" ]; then
              detail=$(tail -20 /tmp/it_server.log 2>/dev/null | tr '\n' '|' | cut -c1-1500)
            fi
            echo "::error::协议集成测试失败，服务端日志: $detail"
          fi
          exit "$RC"

      - name: Cross-process userdata test
        working-directory: src
        run: |
          set +e

          if ! python3 -m py_compile ../tests/cross_process_test.py 2> /tmp/pyc2.txt; then
            echo "::error::cross_process_test.py 语法错误: $(tr '\n' '|' < /tmp/pyc2.txt | cut -c1-800)"
            exit 1
          fi

          # 两个进程：同一工作目录（共享同一份 userdata.csv），端口不同
          rm -f userdata.csv userdata.csv.lock log.txt
          TETRIS_PORT=10001 ./tetris_game > /tmp/pa.log 2>&1 &
          echo $! > /tmp/pa.pid
          TETRIS_PORT=10002 ./tetris_game > /tmp/pb.log 2>&1 &
          echo $! > /tmp/pb.pid

          for port in 10001 10002; do
            for i in $(seq 1 120); do
              if (exec 3<>/dev/tcp/127.0.0.1/$port) 2>/dev/null; then
                break
              fi
              sleep 1
            done
          done

          python3 ../tests/cross_process_test.py --port-a 10001 --port-b 10002
          RC=$?

          kill "$(cat /tmp/pa.pid)" 2>/dev/null
          kill "$(cat /tmp/pb.pid)" 2>/dev/null
          wait "$(cat /tmp/pa.pid)" 2>/dev/null
          wait "$(cat /tmp/pb.pid)" 2>/dev/null
          sleep 1

          if [ "$RC" -ne 0 ]; then
            detail=$(grep -aE 'Error|error|warn|Client\[|缓存|密码|迁移' log.txt 2>/dev/null | tail -25 | tr '\n' '|' | cut -c1-1500)
            echo "::error::跨进程测试失败，服务端日志: $detail"
          fi
          exit "$RC"

      - name: Multi-worker test (2 workers, SO_REUSEPORT)
        working-directory: src
        run: |
          set +e
          rm -f userdata.csv userdata.csv.lock log*.txt

          TETRIS_WORKERS=2 TETRIS_PORT=10003 ./tetris_game > /tmp/mw.log 2>&1 &
          echo $! > /tmp/mw.pid

          for i in $(seq 1 120); do
            if (exec 3<>/dev/tcp/127.0.0.1/10003) 2>/dev/null; then
              break
            fi
            sleep 1
          done
          sleep 2

          # 两个 worker 都必须活着：若 SO_REUSEPORT 失效，第二个会 bind 失败退出，
          # 而第一个仍能服务，光跑集成测试是发现不了的。
          alive=$(pgrep -P "$(cat /tmp/mw.pid)" | wc -l)
          if [ "$alive" -ne 2 ]; then
            echo "::error::多 worker 启动失败：存活 worker = $alive（期望 2）"
            echo "---- mw.log (tail) ----"
            tail -30 /tmp/mw.log
            kill "$(cat /tmp/mw.pid)" 2>/dev/null
            exit 1
          fi

          # 连接会被内核随机分到某个 worker，所以这个测试同时验证了跨 worker 的数据一致性
          python3 ../tests/integration_test.py --port 10003
          RC=$?

          kill "$(cat /tmp/mw.pid)" 2>/dev/null
          wait "$(cat /tmp/mw.pid)" 2>/dev/null
          sleep 1

          if [ "$RC" -ne 0 ]; then
            detail=$(grep -ahE 'Error|error|warn' log.*.txt 2>/dev/null | tail -20 | tr '\n' '|' | cut -c1-1200)
            echo "::error::多 worker 集成测试失败，worker 日志: $detail"
          fi
          exit "$RC"

      - name: Login throughput benchmark (notice)
        working-directory: src
        run: |
          # 登录 = PBKDF2（10 万次迭代）+ 异步线程串行校验，是独立于游戏负载的瓶颈。
          # 共享 runner 的绝对耗时会抖，所以这里只回传数据（::notice::），不设时间阈值。
          bash ../tests/login_bench.sh 128 "1 2" 10110 2

      - name: Smoke test (200 connections)
        working-directory: src
        run: |
          set +e
          ./tetris_game > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid

          for i in $(seq 1 120); do
            if (exec 3<>/dev/tcp/127.0.0.1/9999) 2>/dev/null; then
              break
            fi
            sleep 1
          done

          python3 ../tests/load_test.py 200 200 1 0 \
            --pid "$(cat /tmp/server.pid)" \
            --json /tmp/smoke.json \
            --min-success 0.95
          RC=$?

          kill "$(cat /tmp/server.pid)" 2>/dev/null
          wait "$(cat /tmp/server.pid)" 2>/dev/null
          cat /tmp/smoke.json 2>/dev/null
          if [ "$RC" -ne 0 ]; then
            echo "---- server.log (tail) ----"
            tail -40 /tmp/server.log
          fi
          exit "$RC"

      - name: bench.sh smoke (100 connections)
        run: |
          bash tests/bench.sh 100 100 0 1

      - name: Memory sanity check (sizeof User)
        working-directory: src
        run: |
          cat > sizeof_user.cpp <<'EOF'
          #include "TetrisGame/User.h"
          #include <cstdio>
          int main() {
              const double n = 100000.0;
              std::printf("sizeof(User) = %zu bytes; 100k users ~= %.1f MB\n",
                          sizeof(User), sizeof(User) * n / 1024.0 / 1024.0);
              return 0;
          }
          EOF
          if ! g++ -std=c++17 -I. -ICommon -IUtility -IEventLoop -ITetrisGame -IUImanage -IConnectionPool \
                sizeof_user.cpp -o sizeof_user -lspdlog -lfmt -pthread 2> sizeof_err.txt; then
            echo "::error::sizeof check failed: $(tr '\n' '|' < sizeof_err.txt | cut -c1-900)"
            exit 1
          fi
          out=$(./sizeof_user)
          echo "$out"
          echo "::notice::$out"

      - name: Verify header dependency tracking
        working-directory: src
        run: |
          # makefile 用 -MMD -MP 生成 .d 依赖文件：改头文件必须触发依赖它的 .cpp 重编。
          # 这里只 touch 一个头文件再 make -n 看"编译计划"，不真的重编。
          touch TetrisGame/User.h
          plan=$(make -n 2>&1)
          if ! echo "$plan" | grep -q -- '-c main.cpp'; then
            echo "::error::头文件依赖跟踪失效：touch TetrisGame/User.h 后 make 没有计划重编 main.cpp"
            echo "---- make -n 输出（前 20 行）----"
            echo "$plan" | head -20
            exit 1
          fi
          count=$(echo "$plan" | grep -c -- ' -c ' || true)
          echo "::notice::头文件依赖跟踪正常：touch User.h 触发 ${count} 个源文件重编"
