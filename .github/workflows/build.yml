name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ubuntu-latest / g++
    runs-on: ubuntu-latest
    # 末尾两步要真装一遍 systemd 服务、真 build 一个 Docker 镜像（各自 2~4 分钟），
    # 15 分钟会把整个 job 顶到超时，所以放到 30。
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libevent / spdlog / fmt / OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libevent-dev libspdlog-dev libfmt-dev libssl-dev libsqlite3-dev

      - name: Build
        working-directory: src
        run: |
          # pipefail：make 失败时 tee 不能把退出码吞掉
          set -o pipefail
          # 编译失败时日志全文读不到，所以把前几条 error 用注解回传
          if ! make -j"$(nproc)" 2>&1 | tee /tmp/build.log; then
            echo "::error::编译失败: $(grep -aE 'error:|Error [0-9]|undefined reference' /tmp/build.log | head -8 | tr '\n' '|' | cut -c1-1800)"
            exit 1
          fi
          file tetris_game
          # -O2 可能带出 -O0 时代看不到的告警（未初始化/严格别名等）。
          # 日志正文读不到，所以把前几条回传成注解，便于判断是否是真问题。
          warn=$(grep -c 'warning:' /tmp/build.log || true)
          echo "::notice::构建通过，优化级别 $(make -s print-opt)，编译告警 ${warn} 条"
          if [ "${warn:-0}" -gt 0 ]; then
            echo "::warning::编译告警 ${warn} 条: $(grep 'warning:' /tmp/build.log | head -6 | tr '\n' '|' | cut -c1-1200)"
          fi

      - name: Verify build optimization level
        working-directory: src
        run: |
          # 全部性能数据都依赖优化级别（见 docs/HANDOVER.md 4.7）。
          # 万一 makefile 被改回 -O0，这里直接失败，避免又产出一份不可比的数据。
          opt=$(make -s print-opt)
          case "$opt" in
            *-O2*|*-O3*|*-Ofast*|*-Os*) ;;
            *)
              echo "::error::构建优化级别不是 -O2/-O3/-Os（当前: ${opt:-空}），性能数据将不可比"
              exit 1
              ;;
          esac
          echo "::notice::构建优化级别: $opt"

      - name: Test scripts syntax
        run: |
          # 压测脚本不在 CI 里真跑（远程压测要独立机器），但语法错误在这里拦住
          set +e
          if ! python3 -m py_compile tests/*.py 2> /tmp/pyc_all.txt; then
            echo "::error::测试脚本语法错误: $(tr '\n' '|' < /tmp/pyc_all.txt | cut -c1-1200)"
            exit 1
          fi
          for s in tests/*.sh; do
            if ! bash -n "$s" 2> /tmp/sh_err.txt; then
              echo "::error::shell 语法错误 $s: $(tr '\n' '|' < /tmp/sh_err.txt | cut -c1-800)"
              exit 1
            fi
          done
          echo "::notice::测试脚本语法检查通过：$(ls tests/*.py tests/*.sh | wc -l) 个"

      - name: Password hash self-test
        working-directory: src
        run: |
          # 单独测 PasswordHash：集成测试只能看"登录通不通"，哈希实现错了
          # （盐没进 PBKDF2、hex 编解码错位）也可能自洽地通过。这里用 Python
          # hashlib 生成的已知向量做交叉验证，失败细节用注解回传。
          if ! g++ -std=c++17 -Wall -Wextra -I. TetrisGame/PasswordHash.cpp \
                ../tests/password_hash_test.cpp -lcrypto -pthread -o /tmp/ph_test \
                2> /tmp/ph_build.txt; then
            echo "::error::密码哈希自检编译失败: $(tr '\n' '|' < /tmp/ph_build.txt | cut -c1-1200)"
            exit 1
          fi

          set +e
          out=$(/tmp/ph_test 2>&1)
          rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::密码哈希自检失败: $(echo "$out" | tr '\n' '|' | cut -c1-1500)"
            exit 1
          fi
          echo "::notice::密码哈希自检通过: $(echo "$out" | tr '\n' '|' | cut -c1-600)"

      - name: Auth throttle self-test
        working-directory: src
        run: |
          # 退避是纯状态机（测试里注入时间），把边界（指数增长/封顶/成功清零/
          # 窗口内不延长/过期/条目上限）全枚举出来，不用起服务端。
          if ! g++ -std=c++17 -Wall -Wextra -I. TetrisGame/AuthThrottle.cpp \
                ../tests/auth_throttle_test.cpp -pthread -o /tmp/at_test \
                2> /tmp/at_build.txt; then
            echo "::error::退避自检编译失败: $(tr '\n' '|' < /tmp/at_build.txt | cut -c1-1200)"
            exit 1
          fi

          set +e
          out=$(/tmp/at_test 2>&1)
          rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::退避自检失败: $(echo "$out" | tr '\n' '|' | cut -c1-1500)"
            exit 1
          fi
          echo "::notice::登录退避自检通过: $(echo "$out" | tr '\n' '|' | cut -c1-800)"

      - name: IP fallback self-test
        working-directory: src
        run: |
          # 按 IP 兜底也是纯状态机（时间注入）：阈值 / 滑动窗口 / 拒绝不记账不延长 /
          # 条目上限 fail-open / 多 IP 隔离，全枚举，不用起服务端。
          if ! g++ -std=c++17 -Wall -Wextra -I. TetrisGame/IpThrottle.cpp \
                ../tests/ip_throttle_test.cpp -pthread -o /tmp/ipt_test \
                2> /tmp/ipt_build.txt; then
            echo "::error::IP 兜底自检编译失败: $(tr '\n' '|' < /tmp/ipt_build.txt | cut -c1-1200)"
            exit 1
          fi

          set +e
          out=$(/tmp/ipt_test 2>&1)
          rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::IP 兜底自检失败: $(echo "$out" | tr '\n' '|' | cut -c1-1500)"
            exit 1
          fi
          echo "::notice::IP 兜底自检通过: $(echo "$out" | tr '\n' '|' | cut -c1-800)"

      - name: Protocol integration test
        working-directory: src
        run: |
          set +e

          # 先做语法检查：语法错误的报错在日志里读不到，只能用注解回传
          if ! python3 -m py_compile ../tests/integration_test.py 2> /tmp/pyc.txt; then
            echo "::error::integration_test.py 语法错误: $(tr '\n' '|' < /tmp/pyc.txt | cut -c1-800)"
            exit 1
          fi

          # 用干净的数据文件起服务端，工作目录与测试脚本保持一致（userdata.csv 在 src/）
          # 打开 debug 日志：出问题时能通过注解回传服务端的连接/收发细节
          rm -f tetris.db tetris.db-wal tetris.db-shm userdata.csv log.txt
          TETRIS_LOG_LEVEL=debug ./tetris_game > /tmp/it_server.log 2>&1 &
          echo $! > /tmp/it_server.pid

          for i in $(seq 1 120); do
            if (exec 3<>/dev/tcp/127.0.0.1/9999) 2>/dev/null; then
              break
            fi
            sleep 1
          done

          python3 ../tests/integration_test.py --host 127.0.0.1 --port 9999 --db tetris.db
          RC=$?

          kill "$(cat /tmp/it_server.pid)" 2>/dev/null
          wait "$(cat /tmp/it_server.pid)" 2>/dev/null
          sleep 1

          if [ "$RC" -ne 0 ]; then
            # 服务端日志写在 log.txt（不是 stdout）；挑与连接/收发相关的行
            detail=$(grep -aE 'Client\[|连接池|handleClientData|Error|recv|send|用户|密码|迁移' log.txt 2>/dev/null | tail -30 | tr '\n' '|' | cut -c1-1500)
            if [ -z "$detail" ]; then
              detail=$(tail -20 /tmp/it_server.log 2>/dev/null | tr '\n' '|' | cut -c1-1500)
            fi
            echo "::error::协议集成测试失败，服务端日志: $detail"
          fi
          exit "$RC"

      - name: Legacy CSV import test
        working-directory: src
        run: |
          # 旧版本的 userdata.csv 要能一次性导入 SQLite：先造一份旧格式 CSV，
          # 再让服务端在"空库 + 有 CSV"的目录里启动（导入发生在打开库的时候），
          # 然后验证：账号/成绩入库、旧明文密码能登录、登录后迁移成加盐哈希。
          set +e

          if ! python3 -m py_compile ../tests/csv_import_test.py 2> /tmp/pyc_csv.txt; then
            echo "::error::csv_import_test.py 语法错误: $(tr '\n' '|' < /tmp/pyc_csv.txt | cut -c1-800)"
            exit 1
          fi

          rm -f tetris.db tetris.db-wal tetris.db-shm userdata.csv log.txt
          python3 ../tests/csv_import_test.py --seed-csv userdata.csv \
            --user legacy-csv --password plain-pw-123 --score 4321

          TETRIS_PORT=10008 ./tetris_game > /tmp/csv_server.log 2>&1 &
          echo $! > /tmp/csv_server.pid

          for i in $(seq 1 120); do
            if (exec 3<>/dev/tcp/127.0.0.1/10008) 2>/dev/null; then
              break
            fi
            sleep 1
          done

          python3 ../tests/csv_import_test.py --port 10008 --db tetris.db \
            --user legacy-csv --password plain-pw-123 --score 4321
          RC=$?

          kill "$(cat /tmp/csv_server.pid)" 2>/dev/null
          wait "$(cat /tmp/csv_server.pid)" 2>/dev/null
          sleep 1

          if [ "$RC" -ne 0 ]; then
            detail=$(grep -aE 'SQLite|导入|Error|error|warn' log.txt 2>/dev/null | tail -20 | tr '\n' '|' | cut -c1-1200)
            if [ -z "$detail" ]; then
              detail=$(tail -20 /tmp/csv_server.log 2>/dev/null | tr '\n' '|' | cut -c1-1200)
            fi
            echo "::error::旧 CSV 导入测试失败，服务端日志: $detail"
          fi
          exit "$RC"

      - name: IP fallback integration test
        working-directory: src
        run: |
          # 按 IP 兜底必须用低阈值跑（默认 300 次/5 分钟，测试里等不起）：
          # 这里 5 次/10 秒。用例换用户名喷洒 -> 该 IP 被拦 -> 正确密码也进不去 ->
          # 另一个源地址（127.0.0.2）同时能登录 -> 窗口滑过后恢复。
          set +e

          if ! python3 -m py_compile ../tests/ip_fallback_test.py 2> /tmp/pyc_ip.txt; then
            echo "::error::ip_fallback_test.py 语法错误: $(tr '\n' '|' < /tmp/pyc_ip.txt | cut -c1-800)"
            exit 1
          fi

          rm -f tetris.db tetris.db-wal tetris.db-shm userdata.csv userdata.csv.lock log.txt
          TETRIS_AUTH_IP_MAX_FAILURES=5 TETRIS_AUTH_IP_WINDOW_MS=10000 \
            TETRIS_PORT=10006 ./tetris_game > /tmp/ip_server.log 2>&1 &
          echo $! > /tmp/ip_server.pid

          for i in $(seq 1 120); do
            if (exec 3<>/dev/tcp/127.0.0.1/10006) 2>/dev/null; then
              break
            fi
            sleep 1
          done

          python3 ../tests/ip_fallback_test.py --port 10006 --db tetris.db \
            --max-failures 5 --window-ms 10000
          RC=$?

          kill "$(cat /tmp/ip_server.pid)" 2>/dev/null
          wait "$(cat /tmp/ip_server.pid)" 2>/dev/null
          sleep 1

          if [ "$RC" -ne 0 ]; then
            detail=$(grep -aE '来源 IP|登录|Client\[|Error|error' log.txt 2>/dev/null | tail -25 | tr '\n' '|' | cut -c1-1500)
            if [ -z "$detail" ]; then
              detail=$(tail -20 /tmp/ip_server.log 2>/dev/null | tr '\n' '|' | cut -c1-1500)
            fi
            echo "::error::IP 兜底测试失败，服务端日志: $detail"
          fi
          exit "$RC"

      - name: Cross-process userdata test
        working-directory: src
        run: |
          set +e

          if ! python3 -m py_compile ../tests/cross_process_test.py 2> /tmp/pyc2.txt; then
            echo "::error::cross_process_test.py 语法错误: $(tr '\n' '|' < /tmp/pyc2.txt | cut -c1-800)"
            exit 1
          fi

          # 两个进程：同一工作目录（共享同一份 userdata.csv），端口不同
          rm -f tetris.db tetris.db-wal tetris.db-shm userdata.csv userdata.csv.lock log.txt
          TETRIS_PORT=10001 ./tetris_game > /tmp/pa.log 2>&1 &
          echo $! > /tmp/pa.pid
          TETRIS_PORT=10002 ./tetris_game > /tmp/pb.log 2>&1 &
          echo $! > /tmp/pb.pid

          for port in 10001 10002; do
            for i in $(seq 1 120); do
              if (exec 3<>/dev/tcp/127.0.0.1/$port) 2>/dev/null; then
                break
              fi
              sleep 1
            done
          done

          python3 ../tests/cross_process_test.py --port-a 10001 --port-b 10002 --db tetris.db
          RC=$?

          kill "$(cat /tmp/pa.pid)" 2>/dev/null
          kill "$(cat /tmp/pb.pid)" 2>/dev/null
          wait "$(cat /tmp/pa.pid)" 2>/dev/null
          wait "$(cat /tmp/pb.pid)" 2>/dev/null
          sleep 1

          if [ "$RC" -ne 0 ]; then
            detail=$(grep -aE 'Error|error|warn|Client\[|缓存|密码|迁移' log.txt 2>/dev/null | tail -25 | tr '\n' '|' | cut -c1-1500)
            echo "::error::跨进程测试失败，服务端日志: $detail"
          fi
          exit "$RC"

      - name: Multi-worker test (2 workers, SO_REUSEPORT)
        working-directory: src
        run: |
          set +e
          rm -f tetris.db tetris.db-wal tetris.db-shm userdata.csv userdata.csv.lock log*.txt

          TETRIS_WORKERS=2 TETRIS_PORT=10003 ./tetris_game > /tmp/mw.log 2>&1 &
          echo $! > /tmp/mw.pid

          for i in $(seq 1 120); do
            if (exec 3<>/dev/tcp/127.0.0.1/10003) 2>/dev/null; then
              break
            fi
            sleep 1
          done
          sleep 2

          # 两个 worker 都必须活着：若 SO_REUSEPORT 失效，第二个会 bind 失败退出，
          # 而第一个仍能服务，光跑集成测试是发现不了的。
          alive=$(pgrep -P "$(cat /tmp/mw.pid)" | wc -l)
          if [ "$alive" -ne 2 ]; then
            echo "::error::多 worker 启动失败：存活 worker = $alive（期望 2）"
            echo "---- mw.log (tail) ----"
            tail -30 /tmp/mw.log
            kill "$(cat /tmp/mw.pid)" 2>/dev/null
            exit 1
          fi

          # 连接会被内核随机分到某个 worker，所以这个测试同时验证了跨 worker 的数据一致性
          python3 ../tests/integration_test.py --port 10003 --db tetris.db
          RC=$?

          kill "$(cat /tmp/mw.pid)" 2>/dev/null
          wait "$(cat /tmp/mw.pid)" 2>/dev/null
          sleep 1

          if [ "$RC" -ne 0 ]; then
            detail=$(grep -ahE 'Error|error|warn' log.*.txt 2>/dev/null | tail -20 | tr '\n' '|' | cut -c1-1200)
            echo "::error::多 worker 集成测试失败，worker 日志: $detail"
          fi
          exit "$RC"

      - name: Login throughput benchmark (notice)
        working-directory: src
        run: |
          # 登录 = PBKDF2（10 万次迭代）+ 异步线程串行校验，是独立于游戏负载的瓶颈。
          # 共享 runner 的绝对耗时会抖，所以这里只回传数据（::notice::），不设时间阈值。
          bash ../tests/login_bench.sh 128 "1 2" 10110 2

      - name: Smoke test (200 connections)
        working-directory: src
        run: |
          set +e
          ./tetris_game > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid

          for i in $(seq 1 120); do
            if (exec 3<>/dev/tcp/127.0.0.1/9999) 2>/dev/null; then
              break
            fi
            sleep 1
          done

          python3 ../tests/load_test.py 200 200 1 0 \
            --pid "$(cat /tmp/server.pid)" \
            --json /tmp/smoke.json \
            --min-success 0.95
          RC=$?

          kill "$(cat /tmp/server.pid)" 2>/dev/null
          wait "$(cat /tmp/server.pid)" 2>/dev/null
          cat /tmp/smoke.json 2>/dev/null
          if [ "$RC" -ne 0 ]; then
            echo "---- server.log (tail) ----"
            tail -40 /tmp/server.log
          fi
          exit "$RC"

      - name: bench.sh smoke (100 connections)
        run: |
          bash tests/bench.sh 100 100 0 1

      - name: Connection pool trim test
        working-directory: src
        run: |
          # 池子只涨不缩：跑过一批连接后空闲 User 会一直缓存（每个约 3.1KB，
          # 10 万个 ≈ 300MB，直到重启）。这里用低目标 + 短间隔把 trim 逼出来，
          # 断言它确实把池子压回目标值，并且 trim 之后服务端仍能正常接新连接
          # （池子被清空后 acquire 要能按需创建）。
          set +e

          # 3000 条连接要 3000 个客户端 fd（runner 的默认软限制不一定够）
          ulimit -n 65535 2>/dev/null || echo "ulimit -n 提升失败（当前 $(ulimit -n)），继续尝试"

          rm -f tetris.db tetris.db-wal tetris.db-shm userdata.csv userdata.csv.lock log.txt
          TETRIS_POOL_TRIM_TARGET=256 TETRIS_POOL_TRIM_INTERVAL_MS=300 \
            TETRIS_LOG_LEVEL=info TETRIS_PORT=10007 \
            ./tetris_game > /tmp/trim_server.log 2>&1 &
          echo $! > /tmp/trim_server.pid

          for i in $(seq 1 120); do
            if (exec 3<>/dev/tcp/127.0.0.1/10007) 2>/dev/null; then
              break
            fi
            sleep 1
          done

          python3 ../tests/load_test.py 3000 500 0 0 --port 10007 \
            --json /tmp/trim_load.json --min-success 0.9
          RC_BEFORE=$?

          # 客户端退出后连接才真正关闭：等 100ms 清理定时器把对象还回池子，再等 trim 到点
          sleep 3

          LINE=$(grep -a '连接池 trim' log.txt | tail -1)
          if [ -z "$LINE" ]; then
            echo "::error::连接池 trim 没有发生（日志里没有'连接池 trim'）；日志尾部: $(tail -5 log.txt 2>/dev/null | tr '\n' '|' | cut -c1-900)"
            kill "$(cat /tmp/trim_server.pid)" 2>/dev/null
            exit 1
          fi
          AFTER=$(echo "$LINE" | sed -n 's/.*-> *\([0-9][0-9]*\) (target.*/\1/p')
          # 把所有 trim 行的"trim 前大小"加起来：启动那次是 2048（预创建），
          # 峰值那次是 ~3000。加起来 >= 4200 才能证明"3000 条连接真的被缓存过"。
          SUM_BEFORE=$(grep -a '连接池 trim' log.txt \
            | sed -n 's/.*trim: *\([0-9][0-9]*\) ->.*/\1/p' \
            | awk '{s+=$1} END {print s+0}')
          echo "trim 记录（最后一条）: $LINE"
          echo "trim 前大小累计: ${SUM_BEFORE:-?}（启动 ~2048 + 峰值 ~3000）"

          if [ -z "$AFTER" ] || [ "$AFTER" -gt 256 ]; then
            echo "::error::trim 后池子仍有 $AFTER 个对象（目标 256）: $LINE"
            kill "$(cat /tmp/trim_server.pid)" 2>/dev/null
            exit 1
          fi
          if [ -z "$SUM_BEFORE" ] || [ "$SUM_BEFORE" -lt 4200 ]; then
            echo "::error::trim 前大小累计只有 $SUM_BEFORE（期望 >=4200），说明那 3000 条连接没有被缓存进池子: $LINE"
            kill "$(cat /tmp/trim_server.pid)" 2>/dev/null
            exit 1
          fi

          # 池子被压到 256 之后，新连接必须仍然正常（池空 -> 按需创建）
          python3 ../tests/load_test.py 200 200 0 0 --port 10007 \
            --json /tmp/trim_after.json --min-success 0.9
          RC_AFTER=$?

          kill "$(cat /tmp/trim_server.pid)" 2>/dev/null
          wait "$(cat /tmp/trim_server.pid)" 2>/dev/null

          if [ "$RC_BEFORE" -ne 0 ] || [ "$RC_AFTER" -ne 0 ]; then
            echo "::error::trim 前后压测失败（before=$RC_BEFORE after=$RC_AFTER）"
            exit 1
          fi
          echo "::notice::连接池 trim 生效: $LINE"

      - name: Memory sanity check (sizeof User)
        working-directory: src
        run: |
          cat > sizeof_user.cpp <<'EOF'
          #include "TetrisGame/User.h"
          #include <cstdio>
          int main() {
              const double n = 100000.0;
              std::printf("sizeof(User) = %zu bytes; 100k users ~= %.1f MB\n",
                          sizeof(User), sizeof(User) * n / 1024.0 / 1024.0);
              return 0;
          }
          EOF
          if ! g++ -std=c++17 -I. -ICommon -IUtility -IEventLoop -ITetrisGame -IUImanage -IConnectionPool \
                sizeof_user.cpp -o sizeof_user -lspdlog -lfmt -pthread 2> sizeof_err.txt; then
            echo "::error::sizeof check failed: $(tr '\n' '|' < sizeof_err.txt | cut -c1-900)"
            exit 1
          fi
          out=$(./sizeof_user)
          echo "$out"
          echo "::notice::$out"

      - name: Verify header dependency tracking
        working-directory: src
        run: |
          # makefile 用 -MMD -MP 生成 .d 依赖文件：改头文件必须触发依赖它的 .cpp 重编。
          # 这里只 touch 一个头文件再 make -n 看"编译计划"，不真的重编。
          touch TetrisGame/User.h
          plan=$(make -n 2>&1)
          if ! echo "$plan" | grep -q -- '-c main.cpp'; then
            echo "::error::头文件依赖跟踪失效：touch TetrisGame/User.h 后 make 没有计划重编 main.cpp"
            echo "---- make -n 输出（前 20 行）----"
            echo "$plan" | head -20
            exit 1
          fi
          count=$(echo "$plan" | grep -c -- ' -c ' || true)
          echo "::notice::头文件依赖跟踪正常：touch User.h 触发 ${count} 个源文件重编"

      - name: SSH bridge test (bridge + TETRIS_BIND)
        working-directory: src
        run: |
          # SSH 承载里唯一的新代码是 deploy/tetris-bridge.py：它把一条 SSH 会话的
          # stdin/stdout 接到 127.0.0.1:9999，并补上 raw 模式 / CRLF 翻译 / 本地回显。
          # 这三件任意一件做错，玩家看到的现象都和"telnet 不能用"那个老坑一样，
          # 所以这里逐条断言；另加一条"穿过桥跑真协议"，证明确实能玩。
          # 最后守住 TETRIS_BIND=127.0.0.1 真的把 9999 关在回环里（否则 SSH 承载白做）。
          set +e

          for f in ../deploy/tetris-bridge.py ../tests/bridge_test.py; do
            if ! python3 -m py_compile "$f" 2> /tmp/pyc_bridge.txt; then
              echo "::error::$f 语法错误: $(tr '\n' '|' < /tmp/pyc_bridge.txt | cut -c1-800)"
              exit 1
            fi
          done
          for s in ../deploy/*.sh; do
            if ! bash -n "$s" 2> /tmp/sh_bridge.txt; then
              echo "::error::shell 语法错误 $s: $(tr '\n' '|' < /tmp/sh_bridge.txt | cut -c1-800)"
              exit 1
            fi
          done

          # 1) 桥自身（不需要服务端）
          python3 ../tests/bridge_test.py
          RC_UNIT=$?

          # 2) 穿过桥跑一遍真协议（服务端只绑回环，模拟生产形态）
          rm -f tetris.db tetris.db-wal tetris.db-shm log.txt userdata.csv userdata.csv.lock
          TETRIS_BIND=127.0.0.1 TETRIS_PORT=10014 ./tetris_game > /tmp/bridge_server.log 2>&1 &
          echo $! > /tmp/bridge_server.pid
          for i in $(seq 1 120); do
            if (exec 3<>/dev/tcp/127.0.0.1/10014) 2>/dev/null; then
              break
            fi
            sleep 1
          done

          python3 ../tests/bridge_test.py --server 127.0.0.1:10014 --db tetris.db --skip-unit
          RC_E2E=$?

          # 3) TETRIS_BIND 必须真的生效：监听地址只能是 127.0.0.1:10014
          BOUND=$(ss -ltn 2>/dev/null | awk '$4 ~ /:10014$/ {print $4; exit}')
          RC_BIND=0
          if [ "$BOUND" = "127.0.0.1:10014" ]; then
            echo "::notice::监听地址 $BOUND（9999 只对本机的桥可见）"
          else
            echo "::error::TETRIS_BIND 没生效：监听地址是 '${BOUND:-空}'，期望 127.0.0.1:10014"
            RC_BIND=1
          fi

          kill "$(cat /tmp/bridge_server.pid)" 2>/dev/null
          wait "$(cat /tmp/bridge_server.pid)" 2>/dev/null
          sleep 1

          if [ "$RC_UNIT" -ne 0 ] || [ "$RC_E2E" -ne 0 ] || [ "$RC_BIND" -ne 0 ]; then
            echo "::error::SSH 桥测试失败（unit=$RC_UNIT e2e=$RC_E2E bind=$RC_BIND）；服务端输出尾部: $(tail -12 /tmp/bridge_server.log | tr '\n' '|' | cut -c1-900)"
            exit 1
          fi

      - name: Verify sshd snippet
        run: |
          # deploy/sshd-tetris.conf 是"改别人配置"的东西：写错了不是 CI 挂，而是线上
          # sshd 起不来。用真的 sshd 解析一遍（-t 只查语法，不动本机 sshd），
          # 再用 -T 把 tetris 用户生效的 ForceCommand 打出来核对。
          sudo apt-get install -y --no-install-recommends openssh-server
          sudo mkdir -p /run/sshd
          sudo ssh-keygen -q -t ed25519 -N '' -f /tmp/ssh_host_ed25519_key
          id tetris >/dev/null 2>&1 || sudo useradd --system --shell /bin/sh tetris

          sudo cp deploy/sshd-tetris.conf /tmp/tetris.conf
          sudo tee /tmp/sshd_test.conf > /dev/null <<'EOF'
          Port 2222
          HostKey /tmp/ssh_host_ed25519_key
          PidFile /tmp/sshd_test.pid
          UsePAM no
          Include /tmp/tetris.conf
          EOF

          if ! sudo sshd -t -f /tmp/sshd_test.conf 2> /tmp/sshd_err.txt; then
            echo "::error::sshd 拒绝了这个片段: $(tr '\n' '|' < /tmp/sshd_err.txt | cut -c1-1200)"
            exit 1
          fi

          # 片段是 Include 到主配置中间的：Match 块必须以 "Match all" 收尾，
          # 否则它后面的全局选项会被这个 Match 吞掉（最容易踩、最难查的错）
          last=$(tail -n 1 deploy/sshd-tetris.conf)
          if [ "$last" != "Match all" ]; then
            echo "::error::deploy/sshd-tetris.conf 最后一行必须是 'Match all'，当前是 '$last'"
            exit 1
          fi

          cmd=$(sudo sshd -T -f /tmp/sshd_test.conf \
                -C user=tetris,host=localhost,addr=127.0.0.1 2>/dev/null \
                | awk 'tolower($1)=="forcecommand" {print $2; exit}')
          if [ "$cmd" != "/usr/local/bin/tetris-bridge" ]; then
            echo "::error::tetris 用户生效的 ForceCommand 是 '${cmd:-空}'，期望 /usr/local/bin/tetris-bridge"
            exit 1
          fi
          echo "::notice::sshd 片段语法通过，tetris 用户生效 ForceCommand=$cmd"

      - name: Admin CLI test
        working-directory: src
        run: |
          # tetris-admin 是"线上出事才用"的工具（忘密码、要备份），平时没人跑 ——
          # 坏了正好是最需要它的时候。所以每条子命令都在真库上验证一遍，
          # 并且用测试侧的 credential.py 复算哈希，确认写进去的确实是能通过校验的凭据。
          set +e

          if ! python3 -m py_compile ../tests/admin_test.py 2> /tmp/pyc_admin.txt; then
            echo "::error::admin_test.py 语法错误: $(tr '\n' '|' < /tmp/pyc_admin.txt | cut -c1-800)"
            exit 1
          fi
          if [ ! -x ./tetris-admin ]; then
            echo "::error::缺少 ./tetris-admin（make 没编出管理工具？）"
            exit 1
          fi
          if ! ./tetris-admin --help > /dev/null; then
            echo "::error::tetris-admin --help 都跑不起来"
            exit 1
          fi

          python3 ../tests/admin_test.py --bin ./tetris-admin --server-bin ./tetris_game
          RC=$?
          if [ "$RC" -ne 0 ]; then
            echo "::error::管理命令测试失败（rc=$RC）"
          fi
          exit "$RC"

      - name: Deploy artifacts test (systemd)
        working-directory: src
        run: |
          # 部署形态平时没人跑：Dockerfile 只在真部署时 build，systemd 单元只在真机上
          # 被解析，备份脚本只在 04:15 被 cron 叫醒。写错一个字符 -> CI 全绿、上线当天才发现。
          # 所以这里不只是"看文件"，而是真装一遍、真跑一次备份、真 kill -9 一次。
          set +e

          for f in ../tests/deploy_test.py ../tests/log_rotation_test.py; do
            if ! python3 -m py_compile "$f" 2> /tmp/pyc_deploy.txt; then
              echo "::error::$f 语法错误: $(tr '\n' '|' < /tmp/pyc_deploy.txt | cut -c1-800)"
              exit 1
            fi
          done

          # 1) 静态断言：单元里的 LimitNOFILE/TETRIS_BIND、Dockerfile 的非 root/HEALTHCHECK、
          #    环境变量拼写、备份脚本"失败不留半成品"、文档和单元不漂移
          python3 ../tests/deploy_test.py
          RC_STATIC=$?

          # 2) 日志轮转要真二进制才测得出来（TETRIS_LOG_DIR / _MAX_BYTES / _MAX_FILES）
          python3 ../tests/log_rotation_test.py --bin ./tetris_game --connections 500
          RC_ROTATE=$?

          # 3) 真装一遍：账号/目录/单元/sysctl/开机自启/启动
          sudo ../deploy/install-systemd.sh > /tmp/install-systemd.log 2>&1
          RC_INSTALL=$?
          if [ "$RC_INSTALL" -ne 0 ]; then
            echo "::error::install-systemd.sh 失败（rc=$RC_INSTALL）: $(tail -12 /tmp/install-systemd.log | tr '\n' '|' | cut -c1-1800)"
          fi

          RC_RUNTIME=0
          if [ "$RC_INSTALL" -eq 0 ]; then
            # 3.1 fd 上限 —— systemd 默认值就是连接数的隐藏天花板
            LIMIT=$(systemctl show tetris-game -p LimitNOFILE --value)
            PID=$(systemctl show tetris-game -p MainPID --value)
            PROC_LIMIT=$(awk '/Max open files/ {print $4}' /proc/"$PID"/limits 2>/dev/null)
            if [ "$LIMIT" != "300000:300000" ] || [ "$PROC_LIMIT" != "300000" ]; then
              echo "::error::LimitNOFILE 没生效：单元=$LIMIT 进程=$PROC_LIMIT（期望 300000:300000 / 300000）"
              RC_RUNTIME=1
            fi

            # 3.2 只绑回环（否则玩家能绕过 sshd 直连明文端口）
            BOUND=$(ss -ltn | awk '$4 ~ /:9999$/ {print $4}')
            if [ "$BOUND" != "127.0.0.1:9999" ]; then
              echo "::error::服务端监听地址是 '${BOUND:-空}'，期望 127.0.0.1:9999"
              RC_RUNTIME=1
            fi

            # 3.3 timer 能被解析并运行（单元写错时 is-active 会失败）
            if ! systemctl is-active --quiet tetris-backup.timer; then
              echo "::error::tetris-backup.timer 没起来（单元写错了？）"
              RC_RUNTIME=1
            fi

            # 3.4 真跑一次备份：脚本 + tetris-admin + 权限 + 内容
            sudo systemctl start tetris-backup.service
            RC_BACKUP=$?
            BK=$(ls /var/backups/tetris/tetris-*.db 2>/dev/null | tail -1)
            if [ "$RC_BACKUP" -ne 0 ] || [ -z "$BK" ]; then
              echo "::error::备份失败（rc=$RC_BACKUP）: $(journalctl -u tetris-backup -n 20 --no-pager 2>&1 | tr '\n' '|' | cut -c1-1200)"
              RC_RUNTIME=1
            else
              MODE=$(stat -c '%a' "$BK")
              CHECK=$(python3 -c 'import sqlite3,sys; print(sqlite3.connect(sys.argv[1]).execute("PRAGMA integrity_check").fetchone()[0])' "$BK")
              SIZE=$(stat -c '%s' "$BK")
              if [ "$MODE" != "600" ] || [ "$CHECK" != "ok" ] || [ "$SIZE" -le 0 ]; then
                echo "::error::备份产物不对：$BK 权限=$MODE integrity=$CHECK 大小=$SIZE（期望 600 / ok / >0）"
                RC_RUNTIME=1
              else
                echo "::notice::备份产物正常：$(basename "$BK") ${SIZE}B 权限 $MODE integrity ok"
              fi
            fi

            # 3.5 崩溃自动拉起：要等到**新的** MainPID，别被"还没死透"的旧状态骗过去
            OLD_PID=$(systemctl show tetris-game -p MainPID --value)
            sudo kill -9 "$OLD_PID"
            NEW_PID=""
            for i in $(seq 1 20); do
              NEW_PID=$(systemctl show tetris-game -p MainPID --value)
              if [ -n "$NEW_PID" ] && [ "$NEW_PID" != "0" ] && [ "$NEW_PID" != "$OLD_PID" ] \
                 && systemctl is-active --quiet tetris-game; then
                break
              fi
              sleep 1
            done
            if [ -z "$NEW_PID" ] || [ "$NEW_PID" = "0" ] || [ "$NEW_PID" = "$OLD_PID" ]; then
              echo "::error::kill -9 之后服务没有自动拉起（旧 pid=$OLD_PID 新 pid=${NEW_PID:-空}）"
              RC_RUNTIME=1
            else
              echo "::notice::kill -9 后已自动拉起：pid $OLD_PID -> $NEW_PID"
            fi

            # 3.6 stop 要及时（SIGTERM 被处理；否则容器/重启会等到 TimeoutStopSec）
            START=$(date +%s)
            sudo systemctl stop tetris-game
            ELAPSED=$(( $(date +%s) - START ))
            if [ "$ELAPSED" -gt 5 ]; then
              echo "::error::systemctl stop 用了 ${ELAPSED}s（SIGTERM 没有被处理？）"
              RC_RUNTIME=1
            fi
          fi

          # 别把装了服务的 runner 留给后面的步骤
          sudo systemctl disable --now tetris-game tetris-backup.timer >/dev/null 2>&1 || true

          if [ "$RC_STATIC" -ne 0 ] || [ "$RC_ROTATE" -ne 0 ] || \
             [ "$RC_INSTALL" -ne 0 ] || [ "$RC_RUNTIME" -ne 0 ]; then
            echo "::error::部署形态测试失败（static=$RC_STATIC rotate=$RC_ROTATE install=$RC_INSTALL runtime=$RC_RUNTIME）"
            exit 1
          fi
          echo "::notice::部署形态测试通过：LimitNOFILE=300000/只绑回环/备份 600+integrity ok/kill -9 自动拉起/stop 及时"

      - name: Docker image build and health check
        run: |
          # Dockerfile 平时只在真部署时 build：这里真 build 一次、真跑一个容器，
          # 断言"非 root + HEALTHCHECK 真的 healthy + 9999 能从宿主连上"。
          # 坏掉的镜像发出去，比没有镜像更糟。
          set +e

          docker build -t russia-tetris:ci . > /tmp/docker-build.log 2>&1
          RC_BUILD=$?
          if [ "$RC_BUILD" -ne 0 ]; then
            echo "::error::docker build 失败: $(tail -25 /tmp/docker-build.log | tr '\n' '|' | cut -c1-1800)"
            exit 1
          fi

          docker rm -f tetris-ci >/dev/null 2>&1
          docker run -d --name tetris-ci \
            -e TETRIS_BIND=0.0.0.0 \
            --ulimit nofile=300000:300000 \
            -p 127.0.0.1:10020:9999 \
            --health-interval=2s --health-timeout=3s --health-retries=5 --health-start-period=1s \
            russia-tetris:ci > /dev/null
          RC_RUN=$?
          if [ "$RC_RUN" -ne 0 ]; then
            echo "::error::docker run 失败（rc=$RC_RUN）: $(docker logs tetris-ci 2>&1 | tail -15 | tr '\n' '|' | cut -c1-1200)"
            docker rm -f tetris-ci >/dev/null 2>&1
            exit 1
          fi

          STATUS=""
          for i in $(seq 1 40); do
            STATUS=$(docker inspect -f '{{.State.Health.Status}}' tetris-ci 2>/dev/null)
            [ "$STATUS" = "healthy" ] && break
            sleep 2
          done

          UID_IN_IMAGE=$(docker exec tetris-ci id -u 2>/dev/null)
          FDLIMIT=$(awk '/Max open files/ {print $4}' "/proc/$(docker inspect -f '{{.State.Pid}}' tetris-ci)/limits" 2>/dev/null)
          BYTES=$(timeout 5 bash -c 'exec 3<>/dev/tcp/127.0.0.1/10020; head -c 16 <&3' 2>/dev/null | wc -c)
          ADMIN="ok"
          docker exec tetris-ci tetris-admin stats > /tmp/docker-admin.txt 2>&1 || ADMIN="fail"
          LOGS=$(docker logs tetris-ci 2>&1 | tail -8 | tr '\n' '|' | cut -c1-900)

          echo "health=$STATUS uid=$UID_IN_IMAGE fd=$FDLIMIT bytes=$BYTES admin=$ADMIN"

          RC_DOCKER=0
          [ "$STATUS" = "healthy" ] || { echo "::error::容器不是 healthy（当前 '${STATUS:-空}'）: $LOGS"; RC_DOCKER=1; }
          [ "$UID_IN_IMAGE" != "0" ] || { echo "::error::容器以 root 运行（id -u = 0）"; RC_DOCKER=1; }
          [ "$FDLIMIT" = "300000" ] || { echo "::error::容器内 fd 上限是 '${FDLIMIT:-空}'，期望 300000"; RC_DOCKER=1; }
          [ "${BYTES:-0}" -ge 8 ] || { echo "::error::从宿主连不上容器的 9999（读到 ${BYTES:-0} 字节）"; RC_DOCKER=1; }
          [ "$ADMIN" = "ok" ] || { echo "::error::容器里 tetris-admin stats 跑不起来: $(tr '\n' '|' < /tmp/docker-admin.txt | cut -c1-600)"; RC_DOCKER=1; }

          docker rm -f tetris-ci >/dev/null 2>&1
          if [ "$RC_DOCKER" -ne 0 ]; then
            exit 1
          fi
          echo "::notice::镜像可用：非 root（uid $UID_IN_IMAGE）+ healthy + 9999 可读 + tetris-admin 可用"
