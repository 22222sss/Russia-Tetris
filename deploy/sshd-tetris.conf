# Russia-Tetris 的 sshd 片段：把登录账号固定成"只跑游戏桥"。
#
# 安装（推荐用脚本，见 deploy/install-ssh-bridge.sh）：
#   sudo install -m 0644 deploy/sshd-tetris.conf /etc/ssh/sshd_config.d/tetris.conf
#   sudo sshd -t && sudo systemctl reload ssh
#
# 前提：主配置里有 `Include /etc/ssh/sshd_config.d/*.conf`（Ubuntu 22.04 默认在文件顶部）。
#
# 为什么最后要 `Match all`：
#   sshd 的 Match 块一直生效到"文件结束或下一个 Match"。这个文件是被 Include 到主配置
#   **中间**的，如果不用 Match all 收尾，主配置后面那些全局选项会全部落进这个 Match 里
#   （例如全局的 PasswordAuthentication 会跟着变），排查起来非常痛苦。

Match User tetris
    # 会话一建立就交给桥：玩家永远拿不到 shell，ForceCommand 是他们唯一的入口
    ForceCommand /usr/local/bin/tetris-bridge

    # 游戏是终端程序（全屏 ANSI + 方向键），必须分配 pty；桥会把它切到 raw
    PermitTTY yes

    # 共享登录账号用口令认证（真正的身份是游戏里的账号/密码）。
    # 如果主配置是 PasswordAuthentication no，这里的 yes 会让这个账号仍可用口令。
    PasswordAuthentication yes
    KbdInteractiveAuthentication no

    # 共享账号只用来跑游戏：所有转发/隧道/环境注入一律关掉
    AllowTcpForwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitUserEnvironment no
    PermitUserRC no
    GatewayPorts no
    Banner none

    # 一个玩家一条会话：不允许 ControlMaster 复用出第二条通道（那等于一个人占两局）
    MaxSessions 1

    # 掉线的会话要能被收掉：一条死会话会一直占着一个桥进程 + 一个 User 对象（约 3KB + 一个 Python 进程）
    ClientAliveInterval 300
    ClientAliveCountMax 3

Match all
