# Russia-Tetris 服务端的内核参数
#
# 服务端 listen 用了 65535 的 backlog，内核默认 somaxconn=4096（Ubuntu 22.04）
# 会把它截断；fd 上限则由 systemd 单元的 LimitNOFILE 管（见 deploy/systemd/）。
# 安装方式：sudo install -m 0644 deploy/sysctl.d/99-tetris.conf /etc/sysctl.d/ && sudo sysctl --system
# （deploy/install-systemd.sh 会自动做这一步）

# 监听队列：Server 里 listen(serverSocket, 65535) 的上限受它约束
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535
# 全系统 fd 上限（systemd 把单进程抬到 30 万，系统总量要留出余量）
fs.file-max = 1048576
